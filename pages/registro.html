<!-- registro.html -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Xanda | Registro</title>

  <link rel="stylesheet"
  href="../css/pages/registro.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <header class="header">

    <nav class="navbar">

      <div class="logo-container">

        <div class="logo-img"></div>

        <div class="logo-text">

          <h1>Xanda</h1>

          <span>Hecho en Oaxaca</span>

        </div>

      </div>

    </nav>

  </header>

  <section class="register-section">

    <!-- LEFT -->

    <div class="register-left">

      <p class="mini-title">
        REGISTRO DE PRODUCTORES
      </p>

      <h2>
        Únete a la comunidad Xanda
      </h2>

      <p class="description">

        Registra tu cuenta y comienza a compartir
        tus productos con nuevas regiones.

      </p>

    </div>

    <!-- RIGHT -->

    <div class="register-right">

      <form class="register-form">

        <div class="input-group">

          <label>Nombre</label>

          <input type="text"
          placeholder="Ingresa tu nombre">

        </div>

        <div class="input-group">

          <label>Apellido</label>

          <input type="text"
          placeholder="Ingresa tu apellido">

        </div>

        <div class="input-group">

          <label>Fecha de nacimiento</label>

          <input type="date">

        </div>

        <div class="input-group">

          <label>RFC</label>

          <input type="text"
          placeholder="Ingresa tu RFC">

        </div>

        <div class="input-group">

          <label>Teléfono</label>

          <input type="tel"
          placeholder="Ingresa tu teléfono">

        </div>

        <div class="input-group">

          <label>Correo electrónico</label>

          <input type="email"
          placeholder="Ingresa tu correo">

        </div>

        <div class="input-group">

          <label>Confirmar correo</label>

          <input type="email"
          placeholder="Confirma tu correo">

        </div>

        <div class="input-group">

          <label>Contraseña</label>

          <input type="password"
          placeholder="Crea una contraseña">

        </div>

        <div class="input-group">

          <label>Confirmar contraseña</label>

          <input type="password"
          placeholder="Confirma tu contraseña">

        </div>

        <div class="input-group">

          <label>Categoría</label>

          <select>

            <option>
              Selecciona una categoría
            </option>

            <option>Café</option>

            <option>Textiles</option>

            <option>Artesanías</option>

            <option>Mezcal</option>

          </select>

        </div>

        <button type="submit"
        class="register-btn">

          Registrarme

        </button>

      </form>

    </div>

  </section>

  <script src="../js/pages/registro.js"></script>

</body>

</html>
