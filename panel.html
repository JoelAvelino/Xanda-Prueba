<!-- panel.html -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Xanda | Panel</title>

  <link rel="stylesheet"
  href="panel.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">

      <div class="logo-img"></div>

      <h1>Xanda</h1>

    </div>

    <ul>

      <li>
        <a href="#">
          Dashboard
        </a>
      </li>

      <li>
        <a href="#">
          Mis productos
        </a>
      </li>

      <li>
        <a href="#">
          Agregar producto
        </a>
      </li>

      <li>
        <a href="productores.html">
          Volver
        </a>
      </li>

    </ul>

  </aside>

  <!-- MAIN -->

  <main class="main-content">

    <h2>
      Panel del productor
    </h2>

    <section class="panel-card">

      <h3>
        Registrar producto
      </h3>

      <form id="productForm">

        <input
        type="text"
        placeholder="Nombre del producto"
        required>

        <input
        type="number"
        placeholder="Precio"
        required>

        <select required>

          <option>
            Categoría
          </option>

          <option>Café</option>

          <option>Textiles</option>

          <option>Artesanías</option>

          <option>Mezcal</option>

        </select>

        <textarea
        placeholder="Descripción del producto">
        </textarea>

        <input
        type="file"
        accept="image/*">

        <button type="submit">

          Publicar producto

        </button>

      </form>

    </section>

  </main>

  <script src="panel.js"></script>

</body>

</html>
